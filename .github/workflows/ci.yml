name: WIFISENSE CI Regression Safety Net

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-regression-tests:
    name: Backend tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]

    # PostgreSQL is the production database, so the whole suite runs on it as well as on SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wifisense
          POSTGRES_PASSWORD: ci-postgres-not-a-credential
          POSTGRES_DB: wifisense_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wifisense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx pytest

      - name: Seed a fresh database, start the API, run every backend test
        working-directory: ./backend
        env:
          SEED_DEMO_DATA: "1"
          # throwaway secret shared by the server and test_family_subscription.py (sandbox webhooks); not a real credential
          PAYMENT_WEBHOOK_SECRET: "ci-sandbox-webhook-secret-not-a-credential"
          # PostgreSQL leg only; the SQLite leg leaves DATABASE_URL unset and uses the default file
          DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://wifisense:ci-postgres-not-a-credential@127.0.0.1:5432/wifisense_ci' || '' }}
          PG_ADMIN_URL: ${{ matrix.db == 'postgres' && 'postgresql://wifisense:ci-postgres-not-a-credential@127.0.0.1:5432/postgres' || '' }}
        run: bash ci_backend_tests.sh

      - name: Set up Node.js
        if: matrix.db == 'sqlite'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        if: matrix.db == 'sqlite'
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Frontend tests (session expiry, no hard-coded hosts, no misleading claims)
        if: matrix.db == 'sqlite'
        working-directory: ./frontend
        run: npm test


  # Branch protection on master requires a check with this exact name; it passes only if every matrix leg passed.
  backend-gate:
    name: Backend Boundary & Regression Tests
    runs-on: ubuntu-latest
    needs: backend-regression-tests
    if: ${{ always() }}
    steps:
      - name: Require SQLite and PostgreSQL legs to pass
        run: |
          if [ "${{ needs.backend-regression-tests.result }}" != "success" ]; then
            echo "Backend tests: ${{ needs.backend-regression-tests.result }}"; exit 1
          fi
